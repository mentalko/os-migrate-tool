# os-migrate-tool :: inventory.toml — ПОЛНЫЙ инвентарь путей для сканирования.
# Что реально едет — решает selection.toml (галочки по умолчанию) и ручные
# галочки в чеклисте pack.sh. Пути относительные от $HOME; ведущие "~/" и
# "$HOME/" разворачивает conf.py. Парсинг — tomllib (stdlib python 3.11+).

[meta]
compress_estimate = 55   # оценка сжатия tar.gz в % от исходника

[appimages]              # сканирование *.AppImage (find -maxdepth 1)
dirs = ["~/Applications", "~/bin", "~/Desktop"]

[dotfiles]               # группа dotfiles: каталоги и отдельные файлы home
dirs  = [".config", ".ssh", ".gnupg", ".local/share/fonts", ".local/bin", ".local/share/applications"]
files = [".zshrc", ".bashrc", ".profile", ".gitconfig", ".gitignore_global", ".bash_history", ".zsh_history"]

[agents]                 # группа agents: данные ИИ-агентов
home     = [".qoder", ".codex", ".claude", ".agents", ".jcode", ".gemini", ".minimax-code", ".opencode", ".kilo", ".pi-bolt", ".kimi-code", ".zcode", ".warp", ".paseo"]
config   = [".config/Qoder", ".config/com.qoder.app.stable", ".config/Codex", ".config/cursor", ".config/Cursor", ".config/ZCode", ".config/opencode", ".config/CherryStudio", ".config/warp-terminal"]
sessions = [".local/share/opencode"]   # сессии opencode (opencode.db); сессии zcode — внутри ~/.zcode
# ~/.opencode — установка CLI (bin/node_modules), не сессии: на Arch переустановить.

[browsers]               # профили целиком
paths = [".config/google-chrome", ".config/BraveSoftware", ".config/chromium", ".mozilla"]

[data]                   # не-скрытые каталоги home
paths = ["Documents", "Downloads", "Desktop", "Pictures", "bin"]

[toolchain]              # тяжёлое, обычно переустанавливают
paths = [".rustup", ".nvm", ".bun", ".npm", ".vscode", ".minimax-code/lib"]

[flatpak]                # данные flatpak-приложений
paths = [".var"]

[tmp]                    # пересоздаваемое; пусто — группа не появляется
paths = []

[extra]                  # прочее
paths = ["paperless-ngx", "Sync", "v2rayN"]


.agents|общие скиллы агентов (skills/)
.jcode|JCode CLI: скиллы, конфиги
.gemini|Gemini CLI: сессии, история
.minimax-code|MiniMax-агент: данные и кэш
.opencode|OpenCode: сессии, opencode.db, снапшоты
.kilo|Kilo Code: конфиги
.pi-bolt|pi/bolt-агент: данные
.kimi-code|Kimi Code CLI: сессии
.zcode|ZCode: сессии, конфиги (внимание: credentials.json!)
.warp|Warp Terminal: данные
.paseo|Paseo: данные
Documents/[10] SKILLS|ручная коллекция скиллов (cloudflare, gmail, magnit)
.config/Qoder|Qoder GUI: настройки
.config/com.qoder.app.stable|Qoder GUI (stable): данные приложения
.config/Codex|Codex: конфиги
.config/cursor|Cursor CLI: данные
.config/Cursor|Cursor IDE: настройки и расширения
.config/opencode|OpenCode: конфиги и скиллы
.config/CherryStudio|CherryStudio: чаты, провайдеры, скиллы
.config/warp-terminal|Warp Terminal: настройки
.config/google-chrome|Chrome: профиль, пароли, расширения

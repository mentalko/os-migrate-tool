"

# --- Дефолты чекбоксов (подобраны агентом под пользователя; меняем тут, не в коде) ---
# Группы, по умолчанию ВЫКЛЮЧЕНЫЕ (тяжёлые/опциональные; подпункты наследуют состояние группы).
# Остальные группы и подпункты — включены.
CHECKBOX_GROUPS_OFF="browsers:toolchain:tmp:extra"
# Отдельные подпункты, выключенные поверх группового дефолта. Формат тега: "группа|тег",
# как в чеклисте (например "agent:.qoder" или "dot:Documents/[10] SKILLS").
CHECKBOX_SUBS_OFF=""

# --- Пороги/поведение ---
COMPRESS_ESTIMATE=55   # оценка tar.gz в % от исходника

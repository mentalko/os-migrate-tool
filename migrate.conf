# migrate.conf — пути для os-migrate-tool
# Логика упаковки не содержит хардкода: pack.sh/unpack.sh читают этот файл.
# Формат: ПЕРЕМЕННАЯ="путь1:путь2:..." — разделитель ':' (двоеточие),
# пути могут содержать ПРОБЕЛЫ. Пути относительные от $HOME, кроме APPIMG_DIRS.
# Каждый путь из списков ниже = отдельная строка в чеклисте pack.sh (группа → детали).

# --- AppImage: где искать *.AppImage (абсолютные пути) ---
APPIMG_DIRS="$HOME/Applications:$HOME/bin:$HOME/Desktop"

# --- dotfiles: конфиги и файлы home (группа dotfiles) ---
DOT_DIRS=".config:.ssh:.gnupg:.local/share/fonts:.local/bin:.local/share/applications"
DOT_FILES=".zshrc:.bashrc:.profile:.gitconfig:.gitignore_global:.bash_history:.zsh_history"

# --- Сессии агентов: ОТДЕЛЬНАЯ переменная.
# ВАЖНО: заполняется/актуализируется ИИ-агентом при инициализации на новой системе —
# пути могут отличаться между системами и версиями агентов. Проверять актуальность
# перед каждым прогоном (старый бэкап agent-sessions-20261013_18443 — пример устаревшего пути).
AGENT_SESSIONS_DIRS=".qoder/projects:.codex/sessions:.claude/projects:.codex/agent_sessions"

# --- AI-агенты: данные в home (группа agents) ---
AGENT_DIRS=".qoder:.codex:.claude:.agents:.jcode:.gemini:.minimax-code:.opencode:.kilo:.pi-bolt:.kimi-code:.zcode:.warp:.paseo:Documents/[10] SKILLS"

# --- AI-агенты: данные в .config (тоже группа agents; из dotfiles исключаются) ---
AGENT_CONFIG_DIRS=".config/Qoder:.config/com.qoder.app.stable:.config/Codex:.config/cursor:.config/Cursor:.config/opencode:.config/CherryStudio:.config/warp-terminal"

# --- Браузеры: профили целиком (группа browsers, по умолчанию выключена) ---
BROWSER_DIRS=".config/google-chrome:.config/BraveSoftware:.config/chromium:.mozilla"

# --- Данные: каталоги Documents (группа data) ---
DATA_DIRS="Documents:Downloads:Desktop:Pictures"

# --- Тулчейны/среды: тяжёлые, на Cachy обычно переустанавливаются (группа toolchain, OFF) ---
# .cache сюда НЕ включать: exclude.txt вырезает .cache/ из всех архивов — пункт был бы пустышкой.
TOOLCHAIN_DIRS=".rustup:.nvm:.bun:.npm:.vscode:.minimax-code/lib"

# --- Данные flatpak-приложений (.var) — профили zen/obsidian и т.п. (группа flatpak, ON) ---
FLATPAK_DATA_DIRS=".var"

# --- tmp: НЕ пакуем по умолчанию. Заполни, если нужно (группа tmp, OFF) ---
TMP_DIRS=""

# --- Прочее: свои пути (группа extra, OFF) ---
EXTRA_DIRS="paperless-ngx:Sync:v2rayN"

# --- Описания пунктов чеклиста: что в каталоге / что за программы ---
# Формат: <путь>|<описание> — по одному на строку. Ключ = путь из списков выше
# (для AppImage — имя файла). Агент на новой системе: добавил путь — добавь описание.
DESC_MAP="
.config|конфиги всех GUI/CLI-программ (агентские — отдельно ниже)
.ssh|SSH-ключи, known_hosts, конфиги подключений

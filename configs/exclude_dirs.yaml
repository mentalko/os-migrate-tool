# os-migrate-tool :: exclude_dirs.yaml — что НЕ пакуем и почему.
# tar: шаблоны --exclude-from, применяются ко ВСЕМ сегментам бандла.
# Шаблоны: без хвостового '/' (tar матчит имя каталога без слэша); имя без '/'
# матчится как БАЗОВОЕ ИМЯ на любой глубине (Cache режет Cache везде).
# appimages: правила сканирования *.AppImage.

tar:
  # --- кэши и пересоздаваемое ---
  - .cache                    # кэш программ, пересоздаётся сам
  - cache                     # flatpak/прочие: каталог 'cache' в любом месте
  - .thumbnails               # миниатюры файлов, генерируются заново
  - .local/share/Trash        # корзина — мусор по определению
  # --- зависимости и артефакты сборки (восстанавливаются из манифестов) ---
  - "*/node_modules"          # JS-зависимости: npm/pnpm install по package.json
  - "*/.venv"                 # python-окружение: pip install -r requirements
  - "*/venv"                  # python-окружение (старое имя каталога)
  - "*/__pycache__"           # байткод python, генерируется при запуске
  - "*/site-packages"         # пакеты внутри окружений — дублируют pip
  - "*/target"                # артефакты сборки Rust: cargo build пересоберёт
  - "*/dist"                  # артефакты сборки JS/пакетов
  - "*.pyc"                   # байткод python
  # --- кэши Chromium/Electron по имени каталога (Chrome, Code, edge, flatpak) ---
  - Cache                     # HTTP-кэш
  - "Code Cache"              # кэш кода V8
  - GPUCache                  # GPU-кэш
  - GPUPersistentCache        # GPU-кэш (персистентный)
  - GraphiteDawnCache         # GPU-растеризация Chrome
  - GrShaderCache             # кэш шейдеров
  - ShaderCache               # кэш шейдеров
  - CachedData                # Electron: кэш кода
  - CachedConfigurations      # Electron: кэш конфигураций
  - CachedProfilesData        # VS Code: кэш профилей
  - CachedExtensionVSIXs      # VS Code: скачанные VSIX-расширения
  - Service Worker            # Chromium: CacheStorage сервис-воркеров
  - "Safe Browsing"           # Chrome: базы Safe Browsing
  - optimization_guide_model_store  # Chrome: ML-модели
  - WasmTtsEngine             # Chrome: TTS-модели
  - extensions_crx_cache      # Chrome: кэш crx-загрузок
  - component_crx_cache       # Chrome/Edge: кэш компонентов
  # --- логи и дампы (регенерируемые) ---
  - logs                      # каталоги журналов приложений
  - log                       # журналы (ед. число)
  - Crashpad                  # крэш-дампы Chromium
  - Crashes                   # крэш-дампы (flatpak-приложения)
  # --- кэши/данные конкретных программ ---
  - .zcode/v2/visualizations  # визуализации ZCode — генерируются на лету
  - ".local/share/Throne/config/core*"   # core-дамп Throne (192M)
  # --- непроходимые файлы (root-owned 0600 из docker-контейнера dagu —
  #     tar падает с "Отказано в доступе") ---
  - Documents/Personal-DWH/dagu/data/dag-runs/*/status.jsonl
  # --- дубли данных (решение владельца) ---
  - .config/manicode/projects  # рабочие копии проектов — дублируют ~/Documents
  # --- старьё ---
  - ".local/bin/agy.*.old"    # старые копии бинарника
  # --- тяжёлое и перекачиваемое ---
  - .local/share/Steam        # игры Steam: сотни ГБ, клиент перекачает сам

appimages:
  skip_zero_size: true        # битые/пустые AppImage — условие, не по имени

# Исключения ВНУТРИ конкретного пути (родные для dotfiles/data).
# Ключ — путь из inventory (относительно $HOME), значения — шаблоны tar
# (работают * и ?; '*' матчит и '/' — можно писать ".config/*.asar").
# Бинарники/бандлы сюда: данные едут, исполняемые файлы переустанавливаются.
per_path:
  .config:
    - "*.asar"                 # Obsidian и др. asar-бандлы приложений (24M)
    - "*.AppImage"
    - "*.deb"
    - "*.rpm"
    - "*.so"                   # нативные библиотеки приложений
    - "*.wasm"                 # WASM-рантаймы/модели
  .local/bin:
    - "*.AppImage"             # 223M Freebuff — скачивается по url из mapping.toml
    - uv                       # 37M бинарник uv — переустановить
    - uvx
    - "*.old"
  .zcode:                      # агент ZCode
    - cli/plugins/cache        # 220M кэш плагинов
    - cli/image-cache
    - v2/visualizations        # генерируется на лету
    - "*.rpm"
    - workspace/*/kiri-test    # распакованный rootfs (бинарник)
  .config/ZCode:
    - "*.asar"
  .config/Freebuff:            # браузер Freebuff
    - orchestrator-bundles     # бандлы оркестратора — перекачиваются
  .config/google-chrome:
    - "Default/Extensions/*/data/rules/*"   # rulesets Adblock (~80M), регенерируются
    - CertificateRevocation    # crl-set, качаются заново
    - Dictionaries
    - "*.tflite"               # ML-модели
    - "*.wasm"
  .config/mozilla:
    - "*.tflite"
    - "*.wasm"
  .local/share/opencode:       # сессии opencode: db/auth едут, снимки — нет
    - snapshot
  Downloads:                   # установщики/образы — не данные
    - "*.AppImage"
    - "*.img"
    - "*.iso"
    - "*.tar.xz"
    - "*.tar.zst"
    - "*.pkg.tar.*"
    - redfin-factory-*.zip
    - AlphaDroid-*.zip
    - crDroidAndroid-*.zip
    - Telegram                 # бинарник Telegram в Downloads
    - yay                      # исходники yay
    - alphadroid               # образы Android
    - ventoy-*                 # утилита Ventoy
  v2rayN:
    - v2rayN-linux-64          # 303M бинарник; приложение ставится заново
  bin:                         # ~/bin из группы data
    - rclone                   # 82M бинарник
  Documents:
    - "*.bak"                  # дубли БД (hr_bot.db.bak ~107M)

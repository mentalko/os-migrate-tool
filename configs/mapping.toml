# os-migrate-tool :: mapping.toml — маппинг пакетов Ubuntu → установка на CachyOS.
#
# [packages.<ubuntu-имя>]:
#   name = ubuntu-имя (дублируется внутри для читаемости/поиска)
#   status = "native"  — есть в репозиториях Arch; cachyos = команда установки
#   status = "aur"     — через yay
#   status = "manual"  — руками; url = страница/ссылка скачивания (unpack напечатает)
#   status = "skip"    — не переносить
# Нет записи → пакет не ставится, попадает в missing-mapping.txt.
# unpack выполняет cachyos-команду ТОЛЬКО для native/aur; для manual/flatpak/
# appimages он печатает названия и ссылки в конце (сам ниоткуда не качает).
#
# [appimages."<имя файла>"]: url — страница скачивания AppImage (для переустановки).



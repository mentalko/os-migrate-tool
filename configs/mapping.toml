# --- пользовательские CLI-программы: переустановка на новой системе ---
# секция = менеджер (npm/uv/pipx — команда по умолчанию; bin — бинарники).
# cachyos/ubuntu можно переопределить per-tool; url печатается unpack'ом.

[programs.npm.cline]
url = "https://cline.bot"

[programs.npm."@pen.dev/cli"]
url = "https://pen.dev"

[programs.npm."@trailhq/trail-code"]
url = "https://github.com/trailhq/trail-code"

[programs.npm.neonctl]
url = "https://neon.com/docs/reference/neonctl"

[programs.npm."@qwen-code/qwen-code"]
url = "https://github.com/QwenLM/qwen-code"

[programs.uv.browser-use]
url = "https://browser-use.com"

[programs.uv.graphifyy]
url = "https://github.com/pantera84/graphifyy"

[programs.uv.ruff]
url = "https://docs.astral.sh/ruff/"

[programs.pipx.frappe-bench]
url = "https://frappeframework.com/docs"

[programs.bin.qodercli]
ubuntu = "curl -fsSL https://qoder.com/install | bash"
cachyos = "yay -S qoder-cli"

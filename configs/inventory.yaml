# os-migrate-tool :: inventory.yaml — ПОЛНЫЙ инвентарь путей для сканирования.
# Что реально едет — решает selection.yaml (галочки) и ручные галочки чеклиста.
# Группы — ключи group_*; внутри группы секции (dirs/files/paths/home/config/sessions).
# Пути относительные от $HOME; ведущие "~/" и "$HOME/" разворачивает conf.py.
# Парсер — YAML-подмножество в conf.py (stdlib): отступы 2 пробела, списки "- ",
# комментарии только целыми строками.

meta:
  compress_estimate: 55     # оценка сжатия tar.gz в % от исходника

group_packages:             # манифесты apt/flatpak/vscode/dconf/cron — путей нет
  paths: []

group_appimages:            # сканирование *.AppImage (find -maxdepth 1)
  dirs:
    - ~/Applications
    - ~/bin
    - ~/Desktop

group_dotfiles:             # группа dotfiles: каталоги + отдельные файлы home
  dirs:
    - .config
    - .ssh
    - .gnupg
    - .local/share/fonts
    - .local/bin
    - .local/share/applications
    - .local/share/backgrounds  # обои рабочего стола
    - .pki                    # NSS certdb (сертификаты)
    - .docker                 # конфиг docker CLI
    - .android                # adb-ключи
  files:
    - .zshrc
    - .bashrc
    - .profile
    - .gitconfig
    - .gitignore_global
    - .bash_history
    - .zsh_history
    - .npmrc
    - .yarnrc

group_agents:               # группа agents: данные ИИ-агентов
  home:                     # данные в home
    - .qoder
    - .codex
    - .claude
    - .agents
    - .jcode
    - .gemini
    - .minimax-code
    - .opencode             # установка CLI (bin/node_modules), не сессии
    - .kilo
    - .pi-bolt
    - .kimi-code
    - .zcode
    - .warp
    - .paseo
  config:                   # данные в .config
    - .config/Qoder
    - .config/com.qoder.app.stable
    - .config/Codex
    - .config/cursor
    - .config/Cursor
    - .config/ZCode
    - .config/opencode
    - .config/CherryStudio
    - .config/warp-terminal
  sessions:                 # сессии: покрытые home/config отбрасываются conf.py
    - .local/share/opencode # opencode.db, auth, snapshot; сессии zcode — в ~/.zcode

group_appdata:              # данные десктоп-приложений, не покрытые другими группами
  paths:
    - .local/share/TelegramDesktop   # сессия Telegram (tdata)
    - .local/share/Throne/config     # конфиги прокси Throne (core-дампы режутся)
    - .config/freebuff-desktop       # Freebuff: состояние агента, проекты, ключ устройства

group_programs:             # пользовательские CLI-программы: переустановка командами
  npm:                      # npm i -g <tool>
    - cline
    - "@pen.dev/cli"
    - "@trailhq/trail-code"
    - neonctl
    - "@qwen-code/qwen-code"
  uv:                       # uv tool install <tool>
    - browser-use
    - graphifyy
    - ruff
  pipx:                     # pipx install <tool>
    - frappe-bench
  bin:                      # самостоятельные CLI: команда/ссылка в mapping.toml
    - agy
    - copilot
    - kiro-cli
    - herdr
    - claude
    - cursor-agent
    - devin
    - qodercli

group_browsers:             # профили целиком
  paths:
    - .config/google-chrome
    - .config/BraveSoftware
    - .config/chromium
    - .mozilla
    - .config/Freebuff       # Freebuff Desktop: Partitions, cookies, сессии; кэши режутся

group_data:                 # не-скрытые каталоги home
  paths:
    - Documents
    - Downloads
    - Desktop
    - Pictures
    - bin
    - Music                 # по умолчанию выключено (почти пусто)
    - Videos                # по умолчанию выключено (почти пусто)
    - Public                # по умолчанию выключено (почти пусто)
    - Templates             # по умолчанию выключено (почти пусто)

group_toolchain:            # тяжёлое, обычно переустанавливают
  paths:
    - .rustup
    - .nvm
    - .bun
    - .npm
    - .vscode
    - .minimax-code/lib

group_flatpak:              # данные flatpak-приложений
  paths:
    - .var

group_tmp:                  # пересоздаваемое; пусто — группа не появится
  paths: []

group_extra:                # прочее
  paths:
    - paperless-ngx
    - Sync
    - v2rayN

# --- Описания пунктов чеклиста: ключ = путь (для AppImage — имя файла) ---
desc:
  .config: конфиги всех GUI/CLI-программ (агентские — отдельно)
  .ssh: SSH-ключи, known_hosts, конфиги подключений
  .gnupg: GPG-ключи и доверие
  .local/share/fonts: установленные шрифты
  .local/bin: личные скрипты и бинарники
  .local/share/applications: свои .desktop-лаунчеры
  .local/share/backgrounds: обои рабочего стола
  .pki: сертификаты NSS (certdb)
  .docker: конфиг docker CLI (registry-логины)
  .android: adb-ключи и настройки
  .npmrc: конфиг npm (может содержать токен!)
  .yarnrc: конфиг yarn
  .local/share/TelegramDesktop: Telegram: сессия (tdata) — без переавторизации
  cline: coding-agent CLI (cline.bot)
  "@pen.dev/cli": AI-агент pen.dev для .pen-файлов
  "@trailhq/trail-code": общая память/карта кода для агентов
  neonctl: CLI управляемого Postgres Neon
  "@qwen-code/qwen-code": Qwen Code CLI
  browser-use: браузерная автоматизация для агентов
  graphifyy: graphify/graphify-mcp
  ruff: python linter
  frappe-bench: CLI фреймворка Frappe
  agy: Google Antigravity CLI
  copilot: GitHub Copilot CLI
  kiro-cli: AWS Kiro CLI (ex-Amazon Q)
  herdr: терминал-мультиплексор AI-агентов
  claude: Claude Code
  cursor-agent: Cursor CLI
  devin: Devin CLI (Cognition)
  qodercli: Qoder CLI
  .local/share/Throne/config: Throne (прокси): конфиги и профиль
  .zshrc: конфиг zsh
  .bashrc: конфиг bash
  .profile: переменные окружения при входе
  .gitconfig: глобальный конфиг git
  .gitignore_global: глобальный gitignore
  .bash_history: история команд bash
  .zsh_history: история команд zsh
  .qoder: Qoder (IDE-агент): проекты, сессии, knowledge
  .codex: Codex CLI: сессии, agent_sessions, конфиги
  .claude: Claude Code: проекты и сессии
  .agents: общие скиллы агентов (skills/)
  .jcode: JCode CLI: скиллы, конфиги
  .gemini: Gemini CLI: сессии, история
  .minimax-code: MiniMax-агент: данные и кэш
  .opencode: OpenCode CLI: установка (bin/node_modules) — не сессии
  .kilo: Kilo Code: конфиги
  .pi-bolt: pi/bolt-агент: данные
  .kimi-code: Kimi Code CLI: сессии
  .zcode: ZCode: сессии, конфиги (внимание: credentials.json!)
  .warp: Warp Terminal: данные
  .paseo: Paseo: данные
  .local/share/opencode: OpenCode: сессии (opencode.db), auth, snapshot
  .config/Qoder: Qoder GUI: настройки
  .config/com.qoder.app.stable: Qoder GUI (stable): данные приложения
  .config/Codex: Codex: конфиги
  .config/cursor: Cursor CLI: данные
  .config/Cursor: Cursor IDE: настройки и расширения
  .config/ZCode: ZCode: данные приложения
  .config/opencode: OpenCode: конфиги и скиллы
  .config/CherryStudio: CherryStudio: чаты, провайдеры, скиллы
  .config/warp-terminal: Warp Terminal: настройки
  .config/google-chrome: Chrome: профиль, пароли, расширения
  .config/BraveSoftware: Brave: профиль, пароли, расширения
  .config/chromium: Chromium: профиль
  .mozilla: Firefox: профиль, закладки, пароли
  .config/Freebuff: Freebuff Desktop: профиль (Partitions, cookies, сессии); кэши режутся
  .config/freebuff-desktop: Freebuff: состояние агента, проекты, ключ устройства
  Documents: проекты и рабочие документы
  Downloads: загрузки
  Desktop: рабочий стол (лаунчеры)
  Pictures: изображения
  bin: личные скрипты и утилиты (~/bin)
  Music: музыка
  Videos: видео
  Public: файлы для общего доступа
  Templates: шаблоны документов
  .rustup: Rust: rustup и тулчейны (rustc/cargo)
  .nvm: Node.js: версии через nvm
  .bun: Bun: рантайм и кэш
  .npm: npm: кэш и глобальные пакеты
  .vscode: VS Code: расширения и данные
  .minimax-code/lib: MiniMax: библиотеки
  .var: flatpak-приложения: профили (zen-браузер, obsidian)
  paperless-ngx: Paperless-ngx: локальные документы
  Sync: Syncthing: синхронизируемые данные
  v2rayN: v2rayN: конфиги прокси
  Pen-linux-x86_64.AppImage: Pen: рисование/заметки стилусом
  ZCode.AppImage: ZCode: ИИ-агент (файл битый, 0 байт)
  freebuff.AppImage: Freebuff Desktop: ИИ-агент (AppImage, едет с ~/.local/bin)

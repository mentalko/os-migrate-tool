# os-migrate-tool :: selection.toml — галочки по умолчанию (дерево выбора).
#
# [groups] — булево по группам. Таблицы [группа] — точечные переопределения
# подпунктов: ключ = путь (для AppImage — имя файла), значение on/off.
# Подпункты, не упомянутые в таблице, наследуют состояние группы.
# Ручные галочки в чеклисте pack.sh перекрывают всё это.

[groups]
packages  = true   # манифесты apt/flatpak/vscode/dconf/cron
appimages = true   # *.AppImage из ~/Applications, ~/bin, ~/Desktop
dotfiles  = true   # конфиги, ssh, gnupg, rc-файлы
data      = true   # не-скрытые каталоги home (Documents и др.)
agents    = true   # ИИ-агенты: отмечены только zcode + opencode (см. ниже)
browsers  = true   # Chrome + Firefox
flatpak   = true   # профили flatpak-приложений (.var)
toolchain = false  # rustup/nvm/bun/npm/vscode — переустановить на Cachy
tmp       = false  # группа не существует (пусто в inventory)
extra     = false  # мелочь; v2rayN включен точечно ниже

# --- agents: бэкапим сессии/данные только zcode и opencode ---
[agents]
".zcode" = true                   # сессии, db, конфиги (внимание: credentials!)
".local/share/opencode" = true    # сессии opencode (opencode.db), auth, snapshot
".config/opencode" = true         # конфиги и скиллы opencode
".config/ZCode" = true            # данные приложения ZCode
".qoder" = false
".codex" = false
".claude" = false
".agents" = false
".jcode" = false
".gemini" = false
".minimax-code" = false
".opencode" = false               # установка CLI — переустановить на Arch
".kilo" = false
".pi-bolt" = false
".kimi-code" = false
".warp" = false
".paseo" = false
".config/Qoder" = false
".config/com.qoder.app.stable" = false
".config/Codex" = false
".config/cursor" = false
".config/Cursor" = false
".config/CherryStudio" = false
".config/warp-terminal" = false

# --- extra: группа выключена, но конфиги прокси нужны на новой системе ---
[extra]
"v2rayN" = true
"paperless-ngx" = true
"Sync" = true
